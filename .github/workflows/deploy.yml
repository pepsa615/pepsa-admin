name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (manual runs only)
        required: false
        default: main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_OPTS: -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 11.18.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_ADMIN_API_BASE_URL: ${{ vars.VITE_ADMIN_API_BASE_URL }}
      - name: Package static release
        run: tar -czf "/tmp/pepsa-admin-ui-${GITHUB_SHA}.tar.gz" -C dist .
      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Upload and activate release
        run: |
          test -n "$DEPLOY_HOST" || (echo "Missing DEPLOY_HOST repository secret" >&2 && exit 1)
          test -n "$DEPLOY_USER" || (echo "Missing DEPLOY_USER repository secret" >&2 && exit 1)
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "echo connected as \$(whoami) on \$(hostname)"
          scp $SSH_OPTS "/tmp/pepsa-admin-ui-${GITHUB_SHA}.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/pepsa-admin-ui-${GITHUB_SHA}.tar.gz"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "set -euxo pipefail; deploy_root=\"\${HOME}/var/www/admin\"; mkdir -p \"\${deploy_root}/releases/${GITHUB_SHA}/dist\"; tar -xzf '/tmp/pepsa-admin-ui-${GITHUB_SHA}.tar.gz' -C \"\${deploy_root}/releases/${GITHUB_SHA}/dist\"; ln -sfn \"\${deploy_root}/releases/${GITHUB_SHA}\" \"\${deploy_root}/current\"; echo 'Activated admin frontend ${GITHUB_SHA}'"
