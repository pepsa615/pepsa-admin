name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (manual runs only)
        required: false
        default: main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 11.18.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_ADMIN_API_BASE_URL: ${{ vars.VITE_ADMIN_API_BASE_URL }}
      - name: Package static release
        run: tar -czf "/tmp/pepsa-admin-ui-${GITHUB_SHA}.tar.gz" -C dist .
      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          scp -o StrictHostKeyChecking=accept-new "/tmp/pepsa-admin-ui-${GITHUB_SHA}.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/pepsa-admin-ui-${GITHUB_SHA}.tar.gz"
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "set -e; deploy_root=\"\${HOME}/var/www/admin\"; mkdir -p \"\${deploy_root}/releases/${GITHUB_SHA}/dist\"; tar -xzf '/tmp/pepsa-admin-ui-${GITHUB_SHA}.tar.gz' -C \"\${deploy_root}/releases/${GITHUB_SHA}/dist\"; ln -sfn \"\${deploy_root}/releases/${GITHUB_SHA}\" \"\${deploy_root}/current\"; echo 'Activated admin frontend ${GITHUB_SHA}'"
