server {
    listen 80;
    server_name pepsaadmin.pepsa.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pepsaadmin.pepsa.co;

    ssl_certificate /etc/letsencrypt/live/pepsaadmin.pepsa.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pepsaadmin.pepsa.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /home/pepsa/var/www/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

